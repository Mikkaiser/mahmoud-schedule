<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Team UAE — WorldSkills Shanghai 2026</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101114" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Team UAE">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top" id="top">
    <div class="top-row">
      <div class="brand">
        <span class="brand-team">Team UAE</span>
        <span class="brand-event">WorldSkills Shanghai 2026</span>
      </div>
      <nav class="days" id="days" aria-label="Competition day"></nav>
      <div class="clock" id="clock" title="Shanghai time">
        <span class="clock-time" id="clock-time">--:--</span>
        <span class="clock-label" id="clock-label">Shanghai</span>
      </div>
    </div>
    <div class="top-row top-row-2">
      <nav class="views" id="views" aria-label="View">
        <a href="#" data-view="board">Board</a>
        <a href="#" data-view="now">Now</a>
        <a href="#" data-view="person">Person</a>
      </nav>
      <div class="legend" id="legend" aria-hidden="true">
        <span class="lg lg-work">Competing</span>
        <span class="lg lg-briefing">Briefing</span>
        <span class="lg lg-allocated">Lunch (team slot)</span>
        <span class="lg lg-lunch">Skill's lunch break</span>
        <span class="lg lg-other">Other</span>
        <span class="lg lg-minor" id="lg-minor">Briefing / admin (compact)</span>
        <span class="lg lg-finish">Finish</span>
      </div>
      <button class="density" id="density" type="button" title="Board density">Detailed</button>
      <button class="lock" id="lock" type="button" aria-pressed="false">
        <svg class="lock-icon" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
          <path class="lock-shackle" d="M6 9V6a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <rect x="4" y="9" width="12" height="9" rx="2" fill="currentColor"/>
        </svg>
        <span id="lock-label">Unlock editing</span>
      </button>
    </div>
    <div class="banner" id="banner" hidden></div>
  </header>

  <main id="main" class="main" aria-live="polite"></main>

  <!-- Event detail / edit sheet -->
  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-body" id="sheet-body"></div>
  </section>

  <!-- Passcode dialog -->
  <dialog class="unlock" id="unlock">
    <form method="dialog" id="unlock-form">
      <h2>Unlock editing</h2>
      <p>Enter the team passcode to shift event times. Changes are shared with every device that opens this page.</p>
      <label class="field">
        <span>Passcode</span>
        <input type="password" id="unlock-input" autocomplete="current-password" inputmode="text" required>
      </label>
      <p class="form-error" id="unlock-error" hidden></p>
      <div class="actions">
        <button type="button" class="btn" id="unlock-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary">Unlock</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/app.js"></script>
</body>
</html>
